<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaapNews</title>

    <link rel="icon" href="./images/LOGO.png">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/layout.js" defer></script>
    <script src="./js/home.js" defer></script>
</head>

<body>

<div class="page-layout">
    <site-header show-create></site-header>

    <main class="site-container content-layout">
        <section class="main-feed" aria-labelledby="latest-title">
            <div class="section-heading">
                <span class="eyebrow">Laatste nieuws</span>
                <h1 id="latest-title">Vandaag belangrijk</h1>
            </div>

            <div class="home-feed" data-home-feed>
                <p class="empty-results">Artikelen laden...</p>
            </div>
        </section>

        <aside class="sidebar" aria-label="Zijbalk">
            <section class="side-panel">
                <div class="section-heading compact">
                    <span class="eyebrow">Meest gelezen</span>
                    <h2>Nu populair</h2>
                </div>

                <ol class="trending-list" data-trending-list></ol>
            </section>

            <aside class="ad-section" aria-label="Advertentie">
                <img src="images/AD-Phone.png" alt="Advertentie" class="ad ad-phone">
                <img src="images/AD-Laptop.png" alt="Advertentie" class="ad ad-laptop">
            </aside>
        </aside>
    </main>

    <site-footer></site-footer>
</div>

</body>

</html>
