<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaapNews - Login</title>

  <link rel="icon" href="../images/LOGO.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<main class="auth-page">
  <section class="auth-card">

    <div style="grid-row: span 2">
    <div class="auth-brand">
      <img src="../images/LOGO.png" alt="JaapNieuws logo" class="auth-logo">
      <p>Welkom bij de #1<br>nieuws provider<br>van Nederland!</p>
    </div>
      </div>

    <div class="auth-form">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" placeholder="Vul uw e-mail adres in">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Vul uw wachtwoord in">

      <div class="auth-links">
      <a href="forgot-password.html" class="forgot-password">Wachtwoord vergeten?</a>
      <a href="../index.html?role=journalist" class="journalist-login">Log in als journalist</a>
      </div>

      <a href="../index.html" class="btn btn-primary">Log in</a>
      <a href="../index.html" class="btn btn-secondary">Register</a>
    </div>

  </section>
</main>

</body>
</html>
