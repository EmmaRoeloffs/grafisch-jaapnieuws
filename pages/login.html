<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaapNieuws - Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">
      <img src="../images/LOGO.png" alt="JaapNieuws logo" class="auth-logo">
      <p class="auth-tagline">Welkom bij de #1 nieuws provider van Nederland!</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" placeholder="Vul uw e-mail adres in">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Vul uw wachtwoord in">
        <a href="#" class="forgot-password">Wachtwoord vergeten?</a>
      </div>

      <button type="submit" class="btn btn-primary">Log in</button>
      <a href="#" class="btn btn-secondary">Register</a>
    </form>
  </section>
</main>
</body>
</html>
