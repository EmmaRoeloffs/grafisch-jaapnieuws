<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaapNews</title>
</head>

<link rel="icon" href="./images/LOGO.png">
<link rel="stylesheet" href="css/style.css">

<body>

<div class="page-layout">

  <header class="header">
    <div class="site-container header-inner">
    <img src="images/LOGO.png" alt="logo" class="logo">

    <div class="header-right">
      <a href="pages/create-article.html" class="create-btn hidden" id="journalist">+</a>
      <a href="pages/search.html" class="search-btn">
        <img src="images/search.png" alt="Search" class="search-icon">
      </a>
      <a href="pages/login.html" class="logout">Log uit</a>
    </div>
    </div>
  </header>

  <main class="site-container content-layout">
    <section class="news-list">
      <a href="pages/Article1.html" class="news-card">
        <img src="images/AutoTerWatere.png" alt="Auto in water" class="news-image">
        <h2>Auto te water bij Julianasluisin Gouda, slachtoffer naar ziekenhuis</h2>
      </a>

      <a href="pages/Article2.html" class="news-card">
        <img src="images/NaJarenDalen.png" alt="Werkende armen" class="news-image">
        <h2>Na jaren van daling stijgt het aantal werkende armen weer</h2>
      </a>
    </section>

    <div class="ad-section">
      <img src="images/AD-Phone.png" alt="Advertentie" class="ad ad-phone">
      <img src="images/AD-Laptop.png" alt="Advertentie" class="ad ad-laptop">
    </div>
  </main>

  <footer class="footer">
    <div class="site-container">
    <span class="jaap">Jaap</span><span class="news">News</span>
    </div>
  </footer>

</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get("role");

  if (role === "journalist") {
    document.getElementById("journalist").classList.remove("hidden");
  }
</script>
</body>
</html>
