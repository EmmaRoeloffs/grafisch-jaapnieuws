<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaapNews</title>
</head>

<link rel="icon" href="./images/LOGO.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">

<body>

<div class="page-layout">

  <header class="header">
    <div class="site-container header-inner">
    <img src="images/LOGO.png" alt="logo" class="logo">

    <div class="header-right">
      <button class="search-btn">
        <img src="images/search.png" alt="Search" class="search-icon">
      </button>
      <a href="#" class="logout">Log uit</a>
    </div>
    </div>
  </header>
  <main class="site-container content-layout">
    <section class="news-list">
      <div class="news-card">
        <img src="images/AutoTerWatere.png" class="news-image">
        <h2>Auto te water bij Julianasluisin Gouda, slachtoffer naar ziekenhuis</h2>
      </div>

      <div class="news-card">
        <img src="images/NaJarenDalen.png" alt="Werkende armen" class="news-image">
        <h2>Na jaren van daling stijgt het aantal werkende armen weer</h2>
      </div>
    </section>

    <div class="ad-section">
      <img src="images/AD-Phone.png" alt="Advertentie" class="ad ad-phone">
      <img src="images/AD-Laptop.png" alt="Advertentie" class="ad ad-laptop">
    </div>
  </main>

  <footer class="footer">
    <div class="site-container">
    <span class="jaap">Jaap</span><span class="news">News</span>
    </div>
  </footer>

</div>
</body>
</html>
