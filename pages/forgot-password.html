<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaapNews - Wachtwoord vergeten</title>

    <link rel="icon" href="../images/LOGO.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="auth-page">
    <section class="auth-shell compact-auth" aria-labelledby="forgot-title">
        <div class="auth-card forgot-card">
            <button class="back-btn" type="button" onclick="history.back()" aria-label="Vorige pagina"></button>

            <div class="auth-intro">
                <span class="eyebrow">Account hulp</span>
                <h2 id="forgot-title">Wachtwoord vergeten?</h2>
                <p>Geen zorgen! Dat kan gebeuren. Voer het e-mailadres in dat aan uw account is gekoppeld.</p>
            </div>

            <form class="auth-form">
                <div class="field-group">
                    <label for="email">E-mailadres</label>
                    <input type="email" id="email" placeholder="naam@voorbeeld.nl">
                </div>

                <div class="auth-actions">
                    <a href="login.html" class="btn btn-primary">Stuur code</a>
                </div>
            </form>
        </div>
    </section>
</main>

</body>

</html>
